<!DOCTYPE HTML>
  <html>
    <head>
      <title>Slate</title>
      <style  font-family: Arial, Helvetica, sans-serif; color: #fff;>
      </style>
    </head>
    <body bgcolor="#f0f0f0">
      <center><h1>Slate</h1><br>
      <h2>Welcome to Slate</h2>
      </center>
        <div id="Login">
          <p align="center"><label>User Name: <input type="text" placeholder="         Username" ></label></p>
          <p align="center"><label>Email: <input type="email" placeholder="    yourname@gmail.com "></label></p>
          <p align="center"><label>Password: <input type="password" placeholder="   Password"></label></p>
          <p align="center"><label><input type="button" value="Submit"></label></p>
          <p align="center"> Don't have an account? <a href="#Sign Up" onclick="ShowSignup()">Create Account</a>
        </div>
        <div id="SignUp"><center>This is the sign up page</center>
          <p align="center"><label>User Name: <input type="text" placeholder="         Username" ></label></p>
          <p align="center"><label>Email: <input type="email" placeholder="    yourname@gmail.com "></label></p>
          <p align="center"><label>Password: <input type="password" placeholder="   Password"></label></p>
          <p align="center"><label><input type="button" value="Submit"></label></p>
          <p align="center"> Don't have an account? <a href="#Login" onclick="ShowLogin()">Login</a></p>
        </div>
        <script>
          function ShowSignup(){
            document.getElementById("Login").style.display="none";
            document.getElementById("SignUp").style.display="block";
          }
          function ShowLogin(){
            document.getElementById("Signup").style.display="none";
            document.getElementById("Login").style.display="block";
          }
        </script>
    </body>
  </html>
